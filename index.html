<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Explorer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #e8f0dd;
      background: #101914;
      font-family: system-ui, sans-serif;
    }

    main { width: min(960px, 100%); }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: #c8ef91;
      font-size: clamp(1.3rem, 4vw, 2rem);
      letter-spacing: 0.04em;
    }

    header p {
      margin: 0;
      color: #a7b6a2;
      font-size: 0.9rem;
      text-align: right;
    }

    .frame {
      padding: 8px;
      background: #26372a;
      border: 3px solid #536a4c;
      box-shadow: 0 12px 40px #0008;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #526b43;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    .help {
      margin-top: 12px;
      color: #a7b6a2;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .help strong { color: #e8f0dd; }

    @media (max-width: 560px) {
      header { align-items: start; flex-direction: column; }
      header p { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>PIXEL EXPLORER</h1>
      <p>Explore a larger world that scrolls as you move.</p>
    </header>

    <div class="frame">
      <canvas id="game" width="320" height="180" aria-label="Top-down pixel game"></canvas>
    </div>

    <p class="help">
      <strong>Move:</strong> WASD &nbsp;·&nbsp;
      <strong>Aim:</strong> Arrow keys (diagonal works; direction stays aimed) &nbsp;·&nbsp;
      <strong>Fire:</strong> Space
    </p>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const W = canvas.width;
    const H = canvas.height;
    const WORLD_WIDTH = 1600;
    const WORLD_HEIGHT = 1200;
    const TILE_SIZE = 16;

    const player = { x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, speed: 78 };
    const keys = new Set();
    const bullets = [];
    const aim = { x: 1, y: 0 };
    let lastTime = 0;
    let lastShot = 0;

    // Decorations are placed in world coordinates, so they scroll with the map.
    const plants = [
      { x: 45, y: 42 }, { x: 263, y: 36 }, { x: 69, y: 146 }, { x: 278, y: 132 },
      { x: 390, y: 270 }, { x: 610, y: 190 }, { x: 820, y: 350 }, { x: 1250, y: 230 },
      { x: 1450, y: 510 }, { x: 300, y: 700 }, { x: 560, y: 940 }, { x: 980, y: 820 },
      { x: 1380, y: 1050 }, { x: 1120, y: 1090 }, { x: 170, y: 1060 }, { x: 760, y: 650 }
    ];

    function updateAimFromKeys() {
      let aimX = 0;
      let aimY = 0;

      if (keys.has("arrowleft")) aimX -= 1;
      if (keys.has("arrowright")) aimX += 1;
      if (keys.has("arrowup")) aimY -= 1;
      if (keys.has("arrowdown")) aimY += 1;

      // Keep the last aim direction when no arrow key is held.
      if (aimX !== 0 || aimY !== 0) {
        const length = Math.hypot(aimX, aimY);
        aim.x = aimX / length;
        aim.y = aimY / length;
      }
    }

    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(key)) {
        event.preventDefault();
        keys.add(key);
        updateAimFromKeys();
      }

      if (key === " " || event.code === "Space") {
        event.preventDefault();
        if (!event.repeat) shoot();
      }
    });

    window.addEventListener("keyup", event => {
      keys.delete(event.key.toLowerCase());
      updateAimFromKeys();
    });

    window.addEventListener("blur", () => keys.clear());

    function shoot() {
      const now = performance.now();
      if (now - lastShot < 180) return;
      lastShot = now;

      bullets.push({
        x: player.x + aim.x * 11,
        y: player.y + aim.y * 11,
        vx: aim.x * 190,
        vy: aim.y * 190,
        life: 0.65
      });
    }

    function update(dt) {
      let dx = 0;
      let dy = 0;

      if (keys.has("a")) dx -= 1;
      if (keys.has("d")) dx += 1;
      if (keys.has("w")) dy -= 1;
      if (keys.has("s")) dy += 1;

      if (dx && dy) {
        dx *= Math.SQRT1_2;
        dy *= Math.SQRT1_2;
      }

      player.x = Math.max(14, Math.min(WORLD_WIDTH - 14, player.x + dx * player.speed * dt));
      player.y = Math.max(14, Math.min(WORLD_HEIGHT - 14, player.y + dy * player.speed * dt));

      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;

        if (
          bullet.life <= 0 ||
          bullet.x < 0 || bullet.x > WORLD_WIDTH ||
          bullet.y < 0 || bullet.y > WORLD_HEIGHT
        ) {
          bullets.splice(i, 1);
        }
      }
    }

    function getCamera() {
      return {
        x: Math.max(0, Math.min(WORLD_WIDTH - W, player.x - W / 2)),
        y: Math.max(0, Math.min(WORLD_HEIGHT - H, player.y - H / 2))
      };
    }

    function drawRoom(camera) {
      ctx.fillStyle = "#526b43";
      ctx.fillRect(0, 0, W, H);

      // Draw a world-aligned tiled floor so the ground visibly scrolls.
      const startX = Math.floor(camera.x / TILE_SIZE) * TILE_SIZE;
      const startY = Math.floor(camera.y / TILE_SIZE) * TILE_SIZE;
      for (let worldY = startY; worldY < camera.y + H + TILE_SIZE; worldY += TILE_SIZE) {
        for (let worldX = startX; worldX < camera.x + W + TILE_SIZE; worldX += TILE_SIZE) {
          if (((worldX / TILE_SIZE) + (worldY / TILE_SIZE)) % 2 === 0) {
            ctx.fillStyle = "#587348";
            ctx.fillRect(worldX - camera.x, worldY - camera.y, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      // The map has edges; draw its stone border only when it enters view.
      ctx.fillStyle = "#26372a";
      if (camera.y === 0) ctx.fillRect(0, 0, W, 8);
      if (camera.y + H >= WORLD_HEIGHT) ctx.fillRect(0, H - 8, W, 8);
      if (camera.x === 0) ctx.fillRect(0, 0, 8, H);
      if (camera.x + W >= WORLD_WIDTH) ctx.fillRect(W - 8, 0, 8, H);

      ctx.fillStyle = "#71845a";
      if (camera.y === 0 || camera.y + H >= WORLD_HEIGHT) {
        const borderY = camera.y === 0 ? 2 : H - 5;
        for (let x = 12; x < W - 12; x += 16) ctx.fillRect(x, borderY, 8, 2);
      }

      for (const plant of plants) {
        const screenX = plant.x - camera.x;
        const screenY = plant.y - camera.y;
        if (screenX < -12 || screenX > W + 12 || screenY < -12 || screenY > H + 12) continue;

        ctx.fillStyle = "#304733";
        ctx.fillRect(screenX - 4, screenY + 3, 10, 5);
        ctx.fillStyle = "#83a95b";
        ctx.fillRect(screenX, screenY - 3, 4, 8);
        ctx.fillRect(screenX - 4, screenY, 4, 4);
        ctx.fillRect(screenX + 4, screenY - 1, 4, 4);
        ctx.fillStyle = "#b1c96b";
        ctx.fillRect(screenX, screenY - 5, 3, 3);
      }
    }

    function drawPlayer(camera) {
      // Camera follows the player; the player stays centered except near world edges.
      const screenX = player.x - camera.x;
      const screenY = player.y - camera.y;
      const angle = Math.atan2(aim.y, aim.x);

      ctx.fillStyle = "#273329";
      ctx.fillRect(Math.round(screenX - 6), Math.round(screenY + 5), 13, 4);

      ctx.fillStyle = "#342d38";
      ctx.fillRect(screenX - 5, screenY + 2, 4, 6);
      ctx.fillRect(screenX + 2, screenY + 2, 4, 6);

      ctx.fillStyle = "#315d91";
      ctx.fillRect(screenX - 7, screenY - 5, 14, 11);
      ctx.fillStyle = "#497db2";
      ctx.fillRect(screenX - 5, screenY - 7, 10, 10);

      ctx.fillStyle = "#d9a77b";
      ctx.fillRect(screenX - 4, screenY - 13, 9, 8);
      ctx.fillStyle = "#62443d";
      ctx.fillRect(screenX - 4, screenY - 14, 9, 3);

      ctx.save();
      ctx.translate(screenX, screenY - 1);
      ctx.rotate(angle);
      ctx.fillStyle = "#252a30";
      ctx.fillRect(3, -2, 12, 4);
      ctx.fillStyle = "#adb6aa";
      ctx.fillRect(8, -3, 9, 2);
      ctx.fillStyle = "#7e8d83";
      ctx.fillRect(5, 2, 3, 4);
      ctx.restore();
    }

    function drawBullets(camera) {
      for (const bullet of bullets) {
        const screenX = bullet.x - camera.x;
        const screenY = bullet.y - camera.y;
        if (screenX < -4 || screenX > W + 4 || screenY < -4 || screenY > H + 4) continue;
        ctx.fillStyle = "#ffe68a";
        ctx.fillRect(Math.round(screenX) - 2, Math.round(screenY) - 1, 4, 3);
      }
    }

    function draw() {
      const camera = getCamera();
      drawRoom(camera);
      drawBullets(camera);
      drawPlayer(camera);

      ctx.fillStyle = "#e8f0dd";
      ctx.font = "7px monospace";
      ctx.fillText("NO ENEMIES • EXPLORE", 13, 17);
    }

    function frame(time) {
      const dt = Math.min((time - lastTime) / 1000 || 0, 0.05);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
